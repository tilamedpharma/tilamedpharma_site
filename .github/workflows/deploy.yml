# Mise en ligne automatique sur Hostinger : à chaque envoi sur la branche « main »
# (ou à la demande depuis l'onglet Actions), GitHub construit le site puis l'envoie par FTP dans public_html.
#
# À configurer une fois dans GitHub → Settings → Secrets and variables → Actions :
#   Secrets   : FTP_SERVER (ex. ftp.tilamedpharma.com ou l'IP donnée par Hostinger),
#               FTP_USERNAME, FTP_PASSWORD (compte FTP créé dans hPanel → Fichiers → Comptes FTP)
#   Variables : FTP_DIR (dossier cible vu par ce compte FTP, ex. « public_html/ » ou « / »)
#               FTP_PROTOCOL (facultatif : « ftps » par défaut, « ftp » si Hostinger refuse le chiffrement)
name: Mise en ligne Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Construction du site
        run: npm run build

      - name: Envoi sur Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          # N'envoie que les fichiers modifiés (état mémorisé sur le serveur) ; ne touche pas aux autres fichiers.
          exclude: |
            **/.git*
            **/.git*/**
